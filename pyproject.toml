[project]
name = "velto"
version = "0.1.0"
description = "The public application facade for Qyro, PSX, and Pydux."
readme = "README.md"
requires-python = ">=3.10,<3.13.20"
license = { text = "MIT" }
authors = [
    { name = "Neuri" },
]
dependencies = [
    "qyro-engine>=0.1.0,<1.0.0",
    "velto-core>=0.1.0,<1.0.0",
    "pydux[psx]>=0.1.0,<1.0.0",
]

[project.optional-dependencies]
pyside6 = [
    "qyro-engine[pyside6]>=1.0.0a1,<2.0.0",
    "velto-core[pyside6]>=0.1.0,<1.0.0",
    "pydux[psx,pyside6]>=0.1.0,<1.0.0",
]
pyqt6 = [
    "qyro-engine[pyqt6]>=1.0.0a1,<2.0.0",
    "velto-core[pyqt6]>=0.1.0,<1.0.0",
    "pydux[psx,pyqt6]>=0.1.0,<1.0.0",
]
pyqt5 = [
    "qyro-engine[pyqt5]>=1.0.0a1,<2.0.0",
    "velto-core[pyqt5]>=0.1.0,<1.0.0",
    "pydux[psx,pyqt5]>=0.1.0,<1.0.0",
]
pyside2 = [
    "qyro-engine[pyside2]>=1.0.0a1,<2.0.0",
    "velto-core[pyside2]>=0.1.0,<1.0.0",
    "pydux[psx,pyside2]>=0.1.0,<1.0.0",
]
kivy = [
    "qyro-engine[kivy]>=1.0.0a1,<2.0.0",
    "velto-core[kivy]>=0.1.0,<1.0.0",
    "pydux[psx,kivy]>=0.1.0,<1.0.0",
]
sentry = ["qyro-engine[sentry]>=1.0.0a1,<2.0.0"]

[tool.poetry]
packages = [{ include = "velto" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
